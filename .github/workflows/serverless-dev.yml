name: serverless-dev

on: pull_request

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-24.04-arm
    # OIDC で AWS の一時クレデンシャルを取得するために id-token: write が必要。
    permissions:
      id-token: write
      contents: read
    steps:
      - name: add-mask
        run: |
          echo "::add-mask::${{ secrets.API_URL_MASK }}"

      - name: setup node.js
        uses: actions/setup-node@v3

      - name: install sls
        run: npm i -g serverless

      - name: checkout
        uses: actions/checkout@v1

      # serverless-plugin-scripts（bootstrap の静的ビルドに使用）を取得する
      - name: install plugins
        run: npm install

      # OIDC でデプロイ用 IAM ロールを AssumeRole する（長期アクセスキー廃止）。
      - name: configure aws credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::569790495228:role/lambda-nim-sls-gha-deploy
          aws-region: ap-northeast-1

      - name: deploy
        run: sls deploy --stage dev
        env:
          SERVERLESS_ACCESS_KEY: ${{ secrets.SERVERLESS_ACCESS_KEY }}

